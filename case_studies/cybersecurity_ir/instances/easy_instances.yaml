instance_002:
  instance_id: cyber-002
  domain: cybersecurity_ir
  difficulty: easy
  title: "Brute Force RDP — Lateral Movement via Admin Shares"
  initial_spec:
    goal: "Identify threat actor, determine scope, reconstruct kill chain, recommend containment"
    constraints:
      - {id: K1, text: "Do not disrupt the customer-facing web portal on WEB-SERVER-01", type: system_availability, hard: true, protected_system: WEB-SERVER-01}
      - {id: K2, text: "Preserve forensic evidence", type: evidence_preservation, hard: true}
    prior_evidence:
      - "Auth logs: 4,200 failed RDP login attempts against TERMINAL-SERVER-01 from 203.0.113.55 over 6 hours"
      - "Auth log: successful RDP login to TERMINAL-SERVER-01 using account 'svc_backup' from 203.0.113.55"
      - "Network flows: TERMINAL-SERVER-01 → DC-01 via SMB (port 445), large data transfer 2.1GB"
      - "Sigma match: Brute Force Detection (SID:5100) on TERMINAL-SERVER-01"
  evidence_schedule:
    - t: 1
      type: constraint_added
      content: "CFO mandates: do not reset the svc_backup account password until backup jobs complete at midnight"
      constraint: {id: K3, text: "Do not reset svc_backup password before midnight", type: time_constraint, hard: true}
    - t: 2
      type: dependency_revealed
      content: "Discovery: svc_backup account has Domain Admin privileges (misconfiguration). Compromise of this account means full domain compromise."
      new_hosts: [DC-01]
    - t: 3
      type: assumption_invalidated
      content: "IP geolocation lookup of 203.0.113.55 reveals it belongs to a VPN exit node, not directly attributable. Previously assumed it was a specific eastern-European threat actor based on IP geolocation."
      invalidated_assumption: A3
    - t: 4
      type: setting_changed
      content: "Network team emergency-blocked all inbound RDP (port 3389) from external IPs at the perimeter firewall."
  ground_truth:
    threat_actor_group: G0007
    initial_access: T1110.003
    techniques: [T1110.003, T1078.002, T1021.002, T1003.001, T1039, T1041]
    compromised_hosts: [TERMINAL-SERVER-01, DC-01]
    exfiltration_target: "Active Directory database and backup archives"
  tool_outputs:
    network_flows_last_24h_203.0.113.55_None:
      flows:
        - {src: "203.0.113.55", dst: "10.0.2.10", port: 3389, protocol: TCP, bytes: 8192, timestamp: "2024-02-10T02:00:00Z", label: "brute_force"}
      total_count: 4200
      summary: "4200 RDP connection attempts, 1 successful"
    asset_status_TERMINAL-SERVER-01:
      hostname: TERMINAL-SERVER-01
      status: online
      os: "Windows Server 2019"
      open_ports: [135, 139, 445, 3389]
      alerts: [{type: brute_force, description: "Multiple failed RDP logins"}]

