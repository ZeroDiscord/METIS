instance_010:
  instance_id: cyber-010
  domain: cybersecurity_ir
  difficulty: conflicting
  title: "Two Simultaneous Attackers — Overlapping Compromises"
  initial_spec:
    goal: "Identify threat actor(s), determine scope, reconstruct kill chain(s), recommend containment"
    constraints:
      - {id: K1, text: "Hospital systems — patient safety is paramount, do not disrupt clinical systems", type: system_availability, hard: true, protected_system: CLINICAL-SYS-01}
      - {id: K2, text: "HIPAA compliance — all evidence handling must comply with PHI protections", type: generic, hard: true}
    prior_evidence:
      - "Ransomware note found on ADMIN-SERVER-22: 'Your files have been encrypted by LockBit 3.0. Pay 50 BTC...'"
      - "Simultaneously: anomalous data exfiltration from RESEARCH-DB-01 to cloud storage (not ransomware-related)"
      - "Conflicting TTPs: ransomware deployment uses RDP lateral movement (T1021.001), but exfiltration uses WinRM (T1021.006)"
      - "Different working hours: ransomware activity at 3AM local (consistent with Eastern European actors), exfiltration at 2PM (consistent with East Asian working hours)"
  evidence_schedule:
    - t: 1
      type: constraint_added
      content: "Hospital board mandates: clinical systems must not go offline under any circumstances. Ransomware containment must not affect patient care."
      constraint: {id: K3, text: "Zero tolerance for clinical system downtime", type: system_availability, hard: true, protected_system: CLINICAL-SYS-01}
    - t: 2
      type: dependency_revealed
      content: "Both attackers compromised the same VPN appliance (VPN-GW-01) within 48 hours of each other using the same CVE. They are using the same entry point but different lateral movement paths and objectives."
      new_hosts: [VPN-GW-01]
    - t: 3
      type: assumption_invalidated
      content: "Initial assumption of a single attacker is wrong. Forensic timeline analysis confirms TWO INDEPENDENT threat actors: (1) a financially-motivated ransomware affiliate (generic cybercrime), and (2) APT41/Winnti conducting targeted IP theft of pharmaceutical research data. They are not coordinating — this is coincidental dual compromise through the same vulnerability."
      invalidated_assumption: A1
    - t: 4
      type: setting_changed
      content: "Emergency VPN gateway replacement. The vulnerable appliance is taken offline and replaced with a new, patched system. Both attackers' entry point is now closed, but their established persistence mechanisms on internal systems remain active."
  ground_truth:
    threat_actor_group: G0096  # APT41 is the primary focus (more sophisticated)
    initial_access: T1190
    techniques: [T1190, T1059.001, T1078.002, T1005, T1021.006, T1071.001, T1041]
    compromised_hosts: [ADMIN-SERVER-22, RESEARCH-DB-01, VPN-GW-01]
    exfiltration_target: "Pharmaceutical research data (APT41) + encrypted files (ransomware)"

