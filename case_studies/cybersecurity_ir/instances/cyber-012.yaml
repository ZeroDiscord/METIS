instance_id: cyber-012
domain: cybersecurity_ir
difficulty: conflicting
title: "Supply Chain Compromise \u2014 Ambiguous Vendor Origin"
initial_spec:
  goal: Identify threat actor, determine scope, reconstruct kill chain, recommend
    containment
  constraints:
  - id: K1
    text: "Critical infrastructure \u2014 any containment must be approved by sector\
      \ ISAC"
    type: generic
    hard: true
  - id: K2
    text: Preserve forensic evidence
    type: evidence_preservation
    hard: true
  prior_evidence:
  - 'Anomaly detection: SCADA-MON-01 communicating with previously unknown IP 192.0.2.50
    on port 4443'
  - The communication started exactly when vendor 'IndustrialSoft Inc.' pushed software
    update v3.2.1
  - Vendor's update server SSL certificate matches, but the binary hash differs from
    vendor's published hash
  - Two other utility companies in the sector reported similar anomalies after the
    same update
evidence_schedule:
- t: 1
  type: constraint_added
  content: 'CISA emergency directive: all organizations using IndustrialSoft products
    must disconnect from the internet within 12 hours unless they can confirm clean
    installation'
  constraint:
    id: K3
    text: 'CISA directive: disconnect or confirm clean install within 12 hours'
    type: time_constraint
    hard: true
    max_hours: 12
- t: 2
  type: dependency_revealed
  content: Code analysis of the tampered update reveals it installs a monitoring agent
    on SCADA-MON-01 that forwards SCADA telemetry to 192.0.2.50. Additionally, SCADA-MON-01
    has read access to SCADA-CTRL-01 (the actual control system). The attacker could
    potentially issue control commands through the monitoring agent.
  new_hosts:
  - SCADA-CTRL-01
- t: 3
  type: assumption_invalidated
  content: "Conflicting attribution evidence: (A) Code analysis finds similarities\
    \ with Sandworm/Voodoo Bear (Russia, GRU) \u2014 known for ICS/SCADA targeting.\
    \ (B) BUT the C2 infrastructure (192.0.2.50) is hosted in a data center used by\
    \ Lazarus Group (North Korea) for cryptocurrency theft operations. (C) Further\
    \ analysis reveals the supply chain compromise technique matches neither \u2014\
    \ it's closest to APT41's past supply chain attacks (ShadowPad). Three different\
    \ attributions, all partially supported. Intelligence assessment: likely APT41\
    \ using Sandworm-style ICS techniques with Lazarus-linked infrastructure as a\
    \ false flag."
  invalidated_assumption: A3
- t: 4
  type: setting_changed
  content: "IndustrialSoft releases emergency patch v3.2.2 and revokes the compromised\
    \ code-signing certificate. However, the installed malware persists even after\
    \ the update is applied \u2014 it has its own persistence mechanism independent\
    \ of the vendor software."
ground_truth:
  threat_actor_group: G0096
  initial_access: T1195.002
  techniques:
  - T1195.002
  - T1059.001
  - T1053.005
  - T1082
  - T1005
  - T1071.001
  - T1041
  compromised_hosts:
  - SCADA-MON-01
  - SCADA-CTRL-01
  exfiltration_target: SCADA telemetry and control system configurations
