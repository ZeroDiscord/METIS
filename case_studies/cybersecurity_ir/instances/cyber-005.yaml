instance_id: cyber-005
domain: cybersecurity_ir
difficulty: misleading
title: "False Flag Attribution \u2014 Russian IPs Masking Chinese APT"
initial_spec:
  goal: Identify threat actor, determine scope, reconstruct kill chain, recommend
    containment
  constraints:
  - id: K1
    text: Do not disrupt the customer-facing web portal
    type: system_availability
    hard: true
    protected_system: WEB-PORTAL-01
  - id: K2
    text: Preserve forensic evidence chain-of-custody
    type: evidence_preservation
    hard: true
  - id: K3
    text: Complete initial assessment within 48 hours
    type: time_constraint
    hard: false
    max_hours: 48
  prior_evidence:
  - "IDS alert: Suricata rule SID:2024001 triggered \u2014 known Russian C2 callback\
    \ pattern from WORKSTATION-07"
  - 'Network flows: 3 internal hosts communicating with 185.220.101.x (Tor exit node,
    geolocated to Russia)'
  - 'IOC lookup: malware hash abc123def456 matches VirusTotal entry tagged ''APT28/Fancy
    Bear'' (community attribution)'
  - "Sigma match: Suspicious PowerShell Encoded Command (SID:5001) on WORKSTATION-07\
    \ \u2014 encoded Base64 command downloading second-stage payload"
evidence_schedule:
- t: 1
  type: constraint_added
  content: 'Legal team mandates: all forensic findings must be court-admissible. Chain
    of custody standard elevated to federal level. No evidence may be altered without
    prior forensic imaging.'
  constraint:
    id: K4
    text: All forensic findings must be court-admissible at federal level
    type: evidence_preservation
    hard: true
- t: 2
  type: dependency_revealed
  content: Network forensics reveals WORKSTATION-07 has a persistent VPN tunnel to
    BACKUP-DC-01 via service account 'svc_backup'. BACKUP-DC-01 was not in initial
    scope. If WORKSTATION-07 is compromised, BACKUP-DC-01 must be assumed compromised
    too.
  new_hosts:
  - BACKUP-DC-01
- t: 3
  type: assumption_invalidated
  content: "Deep malware analysis (sandbox + static) reveals: the malware binary contains Mandarin-language debug strings ('调试模式已启用', '连接服务器失败'), uses infrastructure previously attributed to APT41/Winnti/Wicked Panda (China, G0096), and the 'Russian' C2 IPs are actually rented proxy infrastructure from a bulletproof hosting provider. The VirusTotal 'APT28' tag was a community misattribution. Lateral movement logs confirm unauthorized access and data staging on FILE-SERVER-03 via VPN zero-day (T1190)."
  invalidated_assumption: A3
- t: 4
  type: setting_changed
  content: IT operations (uncoordinated with IR team) emergency-patched the VPN appliance,
    closing CVE-2024-5678 that the attacker used for initial persistence. The attacker's
    VPN-based persistence mechanism is now broken, but they may establish new persistence
    via other means already deployed on compromised hosts.
