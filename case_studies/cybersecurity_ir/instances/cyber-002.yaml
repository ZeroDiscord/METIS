  prior_evidence:
  - 'Auth logs: 4,200 failed RDP login attempts against TERMINAL-SERVER-01 from 203.0.113.55
    over 6 hours'
  - 'Auth log: successful RDP login to TERMINAL-SERVER-01 using account ''svc_backup''
