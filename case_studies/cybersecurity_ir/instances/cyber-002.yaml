evidence_schedule:
- t: 1
  type: constraint_added
  content: 'CFO mandates: do not reset the svc_backup account password until backup
    jobs complete at midnight'
  constraint:
    id: K3
    text: Do not reset svc_backup password before midnight
    type: time_constraint
    hard: true
- t: 2
  type: dependency_revealed
  content: 'Discovery: svc_backup account has Domain Admin privileges (misconfiguration).
    Compromise of this account means full domain compromise.'
  new_hosts:
