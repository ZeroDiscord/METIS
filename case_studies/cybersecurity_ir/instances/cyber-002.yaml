instance_id: cyber-002
domain: cybersecurity_ir
difficulty: easy
title: "Brute Force RDP \u2014 Lateral Movement via Admin Shares"
initial_spec:
  goal: Identify threat actor, determine scope, reconstruct kill chain, recommend
    containment
  constraints:
  - id: K1
    text: Do not disrupt the customer-facing web portal on WEB-SERVER-01
    type: system_availability
    hard: true
    protected_system: WEB-SERVER-01
  - id: K2
