  content: IP geolocation lookup of 203.0.113.55 reveals it belongs to a VPN exit
    node, not directly attributable. Previously assumed it was a specific eastern-European
    threat actor based on IP geolocation.
  invalidated_assumption: A3
- t: 4
  type: setting_changed
  content: Network team emergency-blocked all inbound RDP (port 3389) from external
    IPs at the perimeter firewall.
