instance_006:
  instance_id: cyber-006
  domain: cybersecurity_ir
  difficulty: misleading
  title: "Commodity Malware Masking Targeted APT Campaign"
  initial_spec:
    goal: "Identify threat actor, determine scope, reconstruct kill chain, recommend containment"
    constraints:
      - {id: K1, text: "Minimize business disruption to trading floor operations", type: system_availability, hard: true, protected_system: TRADING-SERVER-01}
      - {id: K2, text: "Preserve forensic evidence", type: evidence_preservation, hard: true}
    prior_evidence:
      - "Endpoint AV alert: Generic trojan 'Win32/Agent.NRF' detected on WORKSTATION-21 — auto-quarantined"
      - "User report: employee clicked link in 'invoice' email, browser redirected, AV triggered"
      - "Sigma match: Known commodity malware C2 beacon (SID:5050) — matches Cobalt Strike default profile"
      - "Initial assessment by L1 SOC: routine commodity malware, low severity, standard remediation"
  evidence_schedule:
    - t: 1
      type: constraint_added
      content: "CISO escalates: due to recent SEC filing, any data breach must be reported within 24 hours to the board. All investigation findings are now subject to legal privilege."
      constraint: {id: K3, text: "Findings subject to legal privilege; breach reporting within 24h", type: generic, hard: true}
    - t: 2
      type: dependency_revealed
      content: "Deep packet inspection reveals the 'Cobalt Strike' beacon is actually a custom malleable C2 profile mimicking Cobalt Strike. The real C2 uses DNS tunneling (T1071.004) to a separate infrastructure. WORKSTATION-21 has been exfiltrating data via DNS to ns1.legit-update.com for 3 weeks."
      new_hosts: [DNS-SERVER-01]
    - t: 3
      type: assumption_invalidated
      content: "The 'commodity malware' assumption is completely wrong. Threat intel correlation reveals the custom C2 profile, DNS exfiltration pattern, and target selection (financial sector, trading systems) exactly match Lazarus Group (G0032, North Korea). This is a targeted campaign, not opportunistic malware. The 'generic trojan' detection was the distraction."
      invalidated_assumption: A3
    - t: 4
      type: setting_changed
      content: "IT deployed new DNS filtering appliance that blocks all DNS queries to non-approved resolvers. This disrupts the attacker's DNS tunneling C2 channel but may cause the attacker to switch to alternative C2 methods."
  ground_truth:
    threat_actor_group: G0032
    initial_access: T1566.002
    techniques: [T1566.002, T1204.002, T1059.001, T1027, T1071.004, T1005, T1048.003]
    compromised_hosts: [WORKSTATION-21, DNS-SERVER-01, TRADING-SERVER-01]
    exfiltration_target: "Trading algorithms and financial data"

