instance_id: sysmon-002
domain: system_monitoring
difficulty: misleading_first
initial_spec:
  goal: |
    Investigate performance degradation in SpeedRacer 9 (Simulated Racing Game).
    Baseline FPS was 120 FPS, current FPS is 55 FPS.
    Identify the root cause of performance degradation and submit a final diagnosis.
  game: SpeedRacer 9
  resolution: 1920x1080
  baseline_fps: 120
  current_fps: 55
  environment_overrides:
    fps: 55
    fps_baseline: 120
    one_percent_low: 22
    frametime_variance: "high (frequent main-thread stalls)"
    cpu_utilization_total: 45
    game_thread_utilization: 100
    cpu_temperature: 65
    cpu_clock_ghz: 4.0
    gpu_utilization: 52
    gpu_temperature: 58
    gpu_clock_mhz: 2400
    vram_used_gb: 4.5
    vram_total_gb: 12.0
    ram_used_gb: 8.0
    ram_total_gb: 16.0
    recent_game_update: False
    recent_driver_update: False
    background_processes: "normal (idle 98%)"
    asset_streaming_status: "normal"
    rendering_stalls: "none"
    game_thread_state: "saturated at 100% on physics loop"

evidence_schedule:
  - t: 2
    type: dependency_revealed
    content: |
      NEW TELEMETRY ALERT (P2 — Dependency Revealed):
      Overall CPU utilization of 45% is misleading: Core 0 (main game physics thread) is 100% saturated,
      while the remaining 7 CPU cores are idle at 10-20%.
  - t: 4
    type: assumption_invalidated
    content: |
      NEW SYSTEM EVENT (P3 — Assumption Invalidated):
      Background processes are confirmed clean (system idle 98%).
      GPU temperature is 58°C and GPU utilization is 52%, ruling out GPU hardware limit.
  - t: 5
    type: constraint_added
    content: |
      NEW DIAGNOSTIC REQUIREMENT (P1 — Constraint Added):
      The final diagnosis must explicitly cite single-thread CPU physics saturation and rule out GPU bottleneck and background process interference.

hidden_ground_truth:
  primary_cause: cpu_game_thread_bottleneck
  primary_cause_aliases:
    - cpu_game_thread_bottleneck
    - cpu_single_thread_saturation
    - main_thread_physics_bottleneck
  contributing_factors:
    - core_0_saturated_at_100_percent
    - physics_loop_thread_limit
  ruled_out_causes:
    - gpu_hardware_bottleneck
    - background_process_interference
    - thermal_throttling
  required_evidence_keywords:
    - cpu
    - game_thread
    - single_thread

acceptance_predicate: |
  primary_cause_correct == True AND
  required_evidence_present == True AND
  ruled_out_causes_checked == True AND
  all_perturbations_survived == True

reference_state_per_step:
  - step: 0
    sigma:
      hypotheses: ["GPU or overall CPU bottleneck"]
  - step: 2
    sigma:
      hypotheses: ["CPU single-thread saturation on Core 0"]
      assumptions: ["Overall 45% CPU load hides Core 0 100% saturation"]
