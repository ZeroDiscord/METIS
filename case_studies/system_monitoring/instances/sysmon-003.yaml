instance_id: sysmon-003
domain: system_monitoring
difficulty: easy
initial_spec:
  goal: |
    Investigate sudden frame rate drops in MechBattle Arena (Simulated Action Game).
    Baseline FPS was 100 FPS, current FPS is 40 FPS.
    Gather telemetry, identify the primary cause, and submit a final diagnosis.
  game: MechBattle Arena
  resolution: 1920x1080
  baseline_fps: 100
  current_fps: 40
  environment_overrides:
    fps: 40
    fps_baseline: 100
    one_percent_low: 18
    frametime_variance: "high"
    cpu_utilization_total: 40
    game_thread_utilization: 45
    cpu_temperature: 62
    cpu_clock_ghz: 4.2
    gpu_utilization: 99
    gpu_temperature: 87
    gpu_clock_mhz: 1400
    gpu_power_watts: 180
    gpu_power_limit_watts: 280
    vram_used_gb: 5.0
    vram_total_gb: 12.0
    ram_used_gb: 7.5
    ram_total_gb: 16.0
    recent_game_update: False
    recent_driver_update: False
    background_processes: "normal"

evidence_schedule:
  - t: 2
    type: constraint_added
    content: |
      NEW TELEMETRY ALERT (P1 — Constraint Added):
      GPU temperature has reached 87°C (thermal throttling limit is 84°C).
      GPU clock speed has dropped from 2400MHz baseline to 1400MHz.
      The final diagnosis must cite GPU temperature and clock drop.

hidden_ground_truth:
  primary_cause: gpu_thermal_throttling
  primary_cause_aliases:
    - gpu_thermal_throttling
    - thermal_throttling
    - gpu_overheating
  contributing_factors:
    - gpu_temperature_87c_exceeding_threshold
    - gpu_clock_drop_to_1400mhz
  ruled_out_causes:
    - cpu_bottleneck
    - driver_regression
    - vram_pressure
  required_evidence_keywords:
    - gpu
    - thermal
    - temperature

acceptance_predicate: |
  primary_cause_correct == True AND
  required_evidence_present == True AND
  ruled_out_causes_checked == True AND
  all_perturbations_survived == True

reference_state_per_step:
  - step: 0
    sigma:
      hypotheses: ["GPU thermal throttling"]
