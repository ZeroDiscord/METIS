instance_id: sysmon-009
domain: system_monitoring
difficulty: conflicting
initial_spec:
  goal: |
    Investigate FPS instability in WorldConqueror IV (Simulated RTS Game).
    Baseline FPS was 75 FPS; current FPS is 35–55 FPS with fluctuating frame-times.
    CPU and GPU both show high utilization at different times. Identify the primary bottleneck and submit a diagnosis.
  game: WorldConqueror IV
  resolution: 2560x1440
  baseline_fps: 75
  current_fps: 45
  environment_overrides:
    fps: 45
    fps_baseline: 75
    one_percent_low: 20
    frametime_variance: "high, alternating pattern"
    cpu_utilization_total: 88
    game_thread_utilization: 78
    cpu_temperature: 81
    cpu_clock_ghz: 3.2
    gpu_utilization: 82
    gpu_temperature: 78
    gpu_clock_mhz: 2200
    vram_used_gb: 7.5
    vram_total_gb: 10.0
    ram_used_gb: 14.0
    ram_total_gb: 16.0
    background_processes: "normal (idle 92%)"
    recent_game_update: True
    recent_driver_update: False
    game_update_version: "v3.0.0 (Large AI unit simulation rewrite)"
    ai_thread_utilization: 72
    rendering_thread_utilization: 55

evidence_schedule:
  - t: 2
    type: dependency_revealed
    content: |
      NEW TELEMETRY ALERT (P2 — Dependency Revealed):
      Profiling reveals that frame-time spikes coincide with large-unit-count AI computation turns.
      During AI turns, CPU game thread reaches 100% and GPU drops to 40% utilization (GPU waiting for CPU).
      During rendering phases, GPU reaches 95% and CPU drops to 55%. The alternation creates apparent
      high utilization on both but the primary bottleneck is AI-thread CPU saturation.
  - t: 4
    type: assumption_invalidated
    content: |
      NEW SYSTEM EVENT (P3 — Assumption Invalidated):
      Game update v3.0.0 rewrote the AI unit simulation to be single-threaded, increasing CPU AI computation
      per turn by 3x. CPU temperatures (81°C) are high but below throttle threshold (90°C).
      GPU is rendering correctly and only waits on CPU-delivered draw calls during AI turns.
  - t: 5
    type: constraint_added
    content: |
      NEW DIAGNOSTIC REQUIREMENT (P1 — Constraint Added):
      The final diagnosis must cite CPU AI thread saturation (game update v3.0.0 AI rewrite) as primary cause.
      It must explicitly rule out GPU hardware bottleneck and thermal throttling in rejected_alternatives.

hidden_ground_truth:
  primary_cause: cpu_ai_thread_saturation_after_game_update
  primary_cause_aliases:
    - cpu_ai_thread_saturation_after_game_update
    - cpu_ai_bottleneck
    - ai_thread_cpu_saturation
    - single_thread_ai_bottleneck
  contributing_factors:
    - game_update_v3_0_0_ai_rewrite
    - ai_simulation_single_threaded
    - cpu_at_100_during_ai_turns
  ruled_out_causes:
    - gpu_hardware_bottleneck
    - thermal_throttling
    - vram_pressure
  required_evidence_keywords:
    - ai
    - cpu
    - game_update

acceptance_predicate: |
  primary_cause_correct == True AND
  required_evidence_present == True AND
  ruled_out_causes_checked == True AND
  all_perturbations_survived == True

reference_state_per_step:
  - step: 0
    sigma:
      hypotheses: ["CPU bottleneck", "GPU bottleneck", "thermal throttling"]
      assumptions: ["Both CPU (88%) and GPU (82%) high — unclear which is primary"]
  - step: 2
    sigma:
      hypotheses: ["CPU AI-thread saturation is primary; GPU is waiting on CPU", "GPU hardware limit"]
      assumptions: ["Alternating pattern: AI turns saturate CPU; GPU waits; rendering turns GPU-bound"]
  - step: 4
    sigma:
      hypotheses: ["CPU AI thread saturation due to game update v3.0.0 single-threaded AI rewrite"]
      assumptions: ["Temperature is safe; GPU hardware is fine; game update is the root cause"]
