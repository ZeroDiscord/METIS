instance_id: sysmon-010
domain: system_monitoring
difficulty: conflicting
initial_spec:
  goal: |
    Investigate gradual FPS degradation in WarForge Online (Simulated MMORPG).
    Baseline FPS was 110 FPS; current FPS has dropped to 48 FPS over two weeks with no obvious trigger.
    Multiple subsystems show anomalies. Diagnose the true root cause and submit a final diagnosis.
  game: WarForge Online
  resolution: 1920x1080
  baseline_fps: 110
  current_fps: 48
  environment_overrides:
    fps: 48
    fps_baseline: 110
    one_percent_low: 18
    frametime_variance: "high with periodic 50ms+ spikes"
    cpu_utilization_total: 75
    game_thread_utilization: 65
    cpu_temperature: 84
    cpu_clock_ghz: 3.0
    gpu_utilization: 70
    gpu_temperature: 80
    gpu_clock_mhz: 2100
    vram_used_gb: 9.5
    vram_total_gb: 10.0
    ram_used_gb: 15.5
    ram_total_gb: 16.0
    ram_speed_mhz: 2133
    ram_expected_speed_mhz: 3600
    background_processes: "normal (idle 93%)"
    recent_game_update: False
    recent_driver_update: False
    xmp_profile_enabled: False
    texture_streaming_stalls: "frequent"

evidence_schedule:
  - t: 2
    type: dependency_revealed
    content: |
      NEW TELEMETRY ALERT (P2 — Dependency Revealed):
      CPU temperature is 84°C, just under the throttle threshold (85°C). CPU clocks have dropped from
      expected 4.2 GHz to 3.0 GHz suggesting possible thermal throttling precursor. VRAM is at 95% capacity (9.5/10 GB).
      Initial assessment suggests combined thermal and VRAM pressure.
  - t: 3
    type: assumption_invalidated
    content: |
      NEW SYSTEM EVENT (P3 — Assumption Invalidated):
      Improved cooling (new thermal paste applied) dropped CPU temperature to 68°C.
      CPU clocks did NOT recover — still running at 3.0 GHz. FPS unchanged at 48.
      VRAM stall analysis shows stalls are caused by slow texture data transfer from RAM, not VRAM exhaustion.
      System RAM is running at 2133 MHz despite XMP profile for 3600 MHz being available but disabled in BIOS.
  - t: 5
    type: constraint_added
    content: |
      NEW DIAGNOSTIC REQUIREMENT (P1 — Constraint Added):
      The final diagnosis must cite RAM running below rated speed (XMP disabled — 2133 MHz vs 3600 MHz)
      as the primary cause creating a texture streaming bottleneck. Must rule out thermal throttling
      and VRAM hardware exhaustion in rejected_alternatives.

hidden_ground_truth:
  primary_cause: ram_speed_bottleneck_xmp_disabled
  primary_cause_aliases:
    - ram_speed_bottleneck_xmp_disabled
    - ram_speed_bottleneck
    - xmp_disabled_ram_bottleneck
    - memory_bandwidth_bottleneck
  contributing_factors:
    - xmp_profile_disabled_in_bios
    - ram_at_2133_mhz_vs_rated_3600_mhz
    - texture_streaming_bottleneck_from_slow_ram
  ruled_out_causes:
    - thermal_throttling
    - vram_hardware_exhaustion
    - gpu_hardware_bottleneck
  required_evidence_keywords:
    - ram
    - memory
    - xmp

acceptance_predicate: |
  primary_cause_correct == True AND
  required_evidence_present == True AND
  ruled_out_causes_checked == True AND
  all_perturbations_survived == True

reference_state_per_step:
  - step: 0
    sigma:
      hypotheses: ["Thermal throttling (CPU at 84°C)", "VRAM pressure (95% usage)"]
      assumptions: ["High CPU temp and near-full VRAM are the likely culprits"]
  - step: 2
    sigma:
      hypotheses: ["Thermal throttling", "VRAM pressure", "combined thermal+VRAM"]
      assumptions: ["CPU near throttle, VRAM near full — two potential causes reinforce each other"]
  - step: 3
    sigma:
      hypotheses: ["RAM speed bottleneck (XMP disabled — 2133 MHz vs 3600 MHz)"]
      assumptions: ["Cooling fix did not restore clocks; VRAM stalls trace back to slow RAM bandwidth"]
