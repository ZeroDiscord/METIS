instance_id: sysmon-006
domain: system_monitoring
difficulty: misleading_first
initial_spec:
  goal: |
    Investigate severe FPS instability in HorizonBreach (Simulated Open-World Game).
    Baseline FPS was 85 FPS; current FPS ranges from 10–85 FPS with massive frame-time spikes.
    Identify the root cause and submit a final structured diagnosis.
  game: HorizonBreach
  resolution: 2560x1440
  baseline_fps: 85
  current_fps: 40
  environment_overrides:
    fps: 40
    fps_baseline: 85
    one_percent_low: 8
    frametime_variance: "extreme spikes (20–120ms)"
    cpu_utilization_total: 35
    game_thread_utilization: 30
    cpu_temperature: 60
    cpu_clock_ghz: 3.8
    gpu_utilization: 95
    gpu_temperature: 70
    gpu_clock_mhz: 1900
    vram_used_gb: 6.0
    vram_total_gb: 10.0
    ram_used_gb: 12.0
    ram_total_gb: 32.0
    background_processes: "normal (idle 95%)"
    recent_game_update: False
    recent_driver_update: True
    driver_version: "560.81 (installed 2 days ago)"
    shader_compilation_stalls: "frequent (~3/sec)"

evidence_schedule:
  - t: 2
    type: dependency_revealed
    content: |
      NEW TELEMETRY ALERT (P2 — Dependency Revealed):
      Frame-time spikes correlate exactly with GPU shader compilation events.
      The GPU spends 60–80ms in shader compilation stalls approximately 3 times per second,
      causing the extreme frame-time variance. GPU utilization of 95% is inflated by these stalls.
  - t: 4
    type: assumption_invalidated
    content: |
      NEW SYSTEM EVENT (P3 — Assumption Invalidated):
      Rolling back graphics driver from v560.81 to v555.42 eliminated all shader compilation stalls.
      GPU temperature (70°C) is well below the throttling threshold (85°C).
      GPU hardware passed stress-test without stalls on the older driver.
  - t: 5
    type: constraint_added
    content: |
      NEW DIAGNOSTIC REQUIREMENT (P1 — Constraint Added):
      The final diagnosis must explicitly cite driver regression (shader compilation bug in v560.81)
      and must rule out GPU hardware failure and thermal throttling in rejected_alternatives.

hidden_ground_truth:
  primary_cause: graphics_driver_regression
  primary_cause_aliases:
    - graphics_driver_regression
    - driver_regression
    - driver_shader_compilation_bug
    - shader_compilation_regression
  contributing_factors:
    - driver_v560_81_shader_compilation_bug
    - frequent_shader_stalls_3_per_second
  ruled_out_causes:
    - gpu_hardware_failure
    - thermal_throttling
    - vram_pressure
  required_evidence_keywords:
    - driver
    - shader
    - compilation

acceptance_predicate: |
  primary_cause_correct == True AND
  required_evidence_present == True AND
  ruled_out_causes_checked == True AND
  all_perturbations_survived == True

reference_state_per_step:
  - step: 0
    sigma:
      hypotheses: ["GPU hardware failure or VRAM pressure (95% GPU utilization, extreme spikes)"]
      assumptions: ["High GPU utilization and low CPU load point to GPU hardware or VRAM limit"]
  - step: 2
    sigma:
      hypotheses: ["Graphics driver shader compilation bug", "GPU hardware failure"]
      assumptions: ["Frame spikes correlate with shader stalls — driver or hardware cause"]
  - step: 4
    sigma:
      hypotheses: ["Graphics driver regression (v560.81 shader compilation bug)"]
      assumptions: ["Driver rollback eliminates stalls; GPU hardware is healthy; temperature normal"]
